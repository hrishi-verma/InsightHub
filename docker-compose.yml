services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "127.0.0.1:9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  postgres:
    image: timescale/timescaledb:latest-pg15
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: insighthub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Run once on a fresh database, in name order (after the image's own 000_install_timescaledb.sh).
      - ./database/init.sql:/docker-entrypoint-initdb.d/100_init.sql:ro
      - ./database/migrations/001_error_tracking.sql:/docker-entrypoint-initdb.d/101_error_tracking.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d insighthub"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - kafka
      - postgres
    environment:
      KAFKA_BROKER: kafka:9092
      SERVICE_TOKEN: dev-token-123
      DB_HOST: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}

  processor:
    build: ./processor-service
    depends_on:
      - kafka
      - postgres
      - ml-engine
    environment:
      KAFKA_BROKER: kafka:9092
      DB_HOST: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      ML_ENGINE_URL: http://ml-engine:5000

  ml-engine:
    build: ./ml-engine
    ports:
      - "5000:5000"
    volumes:
      - ml-models:/app/models

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  ml-models:
